<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>红色格子跳跃</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 引入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('rgj-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  /* ==================== M3 亮色 ==================== */
  :root {
    color-scheme: light;
    --primary: #6750A4;
    --on-primary: #FFFFFF;
    --primary-container: #EADDFF;
    --on-primary-container: #21005D;
    --secondary-container: #E8DEF8;
    --on-secondary-container: #1D192B;
    --tertiary-container: #FFD8E4;
    --on-tertiary-container: #31111D;
    --surface: #FFFFFF;
    --on-surface: #1D1B20;
    --on-surface-variant: #49454F;
    --surface-container-low: #F7F2FA;
    --surface-container: #F3EDF7;
    --surface-container-high: #ECE6F0;
    --surface-container-highest: #E6E0E9;
    --surface-variant: #E7E0EC;
    --outline: #79747E;
    --outline-variant: #CAC4D0;
    --error: #B3261E;
    --error-hover: #C43A32;
    --ripple: rgba(255, 255, 255, .55);
    --state-hover: rgba(29, 27, 32, .08);
    --state-press: rgba(29, 27, 32, .12);
    --elev1: 0 1px 2px rgba(0, 0, 0, .3), 0 1px 3px 1px rgba(0, 0, 0, .15);
    --elev2: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 6px 2px rgba(0, 0, 0, .15);
    --elev3: 0 1px 3px rgba(0, 0, 0, .3), 0 4px 8px 3px rgba(0, 0, 0, .15);
    
    --gold: #FFD700;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
  }

  /* ==================== M3 暗色 ==================== */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: #D0BCFF;
    --on-primary: #381E72;
    --primary-container: #4F378B;
    --on-primary-container: #EADDFF;
    --secondary-container: #4A4458;
    --on-secondary-container: #E8DEF8;
    --tertiary-container: #633B48;
    --on-tertiary-container: #FFD8E4;
    --surface: #000000;
    --on-surface: #E6E0E9;
    --on-surface-variant: #CAC4D0;
    --surface-container-low: #121216;
    --surface-container: #1A1A1F;
    --surface-container-high: #232328;
    --surface-container-highest: #2E2E34;
    --surface-variant: #49454F;
    --outline: #938F99;
    --outline-variant: #49454F;
    --error: #FF5449;
    --error-hover: #FF6B62;
    --ripple: rgba(105, 0, 5, .40);
    --state-hover: rgba(230, 224, 233, .08);
    --state-press: rgba(230, 224, 233, .14);
    --elev1: 0 1px 3px rgba(0, 0, 0, .8);
    --elev2: 0 2px 6px rgba(0, 0, 0, .9);
    --elev3: 0 6px 16px rgba(0, 0, 0, .95);
    
    --gold: #FFD700;
    --silver: #A0A0A0;
    --bronze: #B87333;
  }

  * { box-sizing: border-box; }
  html { height: 100%; overflow: hidden; overscroll-behavior: none; }

  body {
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    font-family: 'Roboto', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .3s ease, color .3s ease;
  }

  .app {
    margin: 0 auto;
    width: 100%;
    max-width: 600px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ==================== 顶部栏 ==================== */
  .top-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 40px;
    padding: 0 4px;
  }

  .app-title {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .1px;
    color: var(--on-surface);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
  }

  .icon-btn {
    width: 40px; height: 40px; flex: 0 0 auto;
    display: grid; place-items: center;
    border: none; border-radius: 50%; background: transparent;
    color: var(--on-surface-variant); cursor: pointer;
    transition: background-color .2s ease, color .2s ease, transform .1s ease;
  }
  .icon-btn:hover { background: var(--state-hover); color: var(--on-surface); }
  .icon-btn:active { background: var(--state-press); transform: scale(.92); }
  .icon-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); }
  .icon-btn svg { display: block; pointer-events: none; }
  .icon-hidden { display: none !important; }

  /* ==================== 弹窗与菜单 ==================== */
  .menu-backdrop, .modal-backdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .3);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, visibility .18s;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-backdrop { background: transparent; }
  .menu-backdrop.open, .modal-backdrop.open { opacity: 1; visibility: visible; pointer-events: auto; }

  .settings-menu {
    position: absolute;
    top: 44px; right: 0; width: 284px; max-width: calc(100vw - 28px);
    padding: 14px; border-radius: 20px;
    background: var(--surface-container);
    box-shadow: var(--elev3); z-index: 40;
    display: flex; flex-direction: column; gap: 16px;
    max-height: calc(100vh - 72px);
    max-height: calc(100dvh - 72px);
    overflow-y: auto; overscroll-behavior: contain;
    touch-action: pan-y; -webkit-overflow-scrolling: touch;
    transform-origin: top right; opacity: 0; visibility: hidden; pointer-events: none;
    transform: scale(.9) translateY(-8px);
    transition: opacity .14s ease, transform .22s cubic-bezier(.2, 0, 0, 1), visibility .22s;
  }
  .settings-menu.open { opacity: 1; visibility: visible; pointer-events: auto; transform: scale(1) translateY(0); }
  .menu-section { display: flex; flex-direction: column; gap: 8px; }
  .menu-label { font-size: 11.5px; font-weight: 500; letter-spacing: .5px; color: var(--on-surface-variant); }

  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 0; }
  .switch-desc { font-size: 12.5px; color: var(--on-surface); font-weight: 500; }

  .m3-switch {
    position: relative; width: 52px; height: 32px; border-radius: 16px;
    border: 2px solid var(--outline); background: transparent;
    cursor: pointer; padding: 0; transition: background-color .2s, border-color .2s; flex: 0 0 auto;
  }
  .m3-switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
  .switch-thumb {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%; background: var(--outline);
    transition: width .2s, height .2s, left .2s, background-color .2s; pointer-events: none;
  }
  .m3-switch[aria-checked="true"] .switch-thumb { left: 18px; width: 24px; height: 24px; background: var(--on-primary); }

  .size-grid { display: flex; border: 1px solid var(--outline); border-radius: 999px; overflow: hidden; }
  .size-grid button {
    flex: 1; height: 38px; border: none; border-right: 1px solid var(--outline);
    background: transparent; color: var(--on-surface);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background-color .2s ease, color .2s ease;
  }
  .size-grid button:last-child { border-right: none; }
  .size-grid button:hover { background: var(--state-hover); }
  .size-grid button.selected { background: var(--secondary-container); color: var(--on-secondary-container); font-weight: 700; }

  .menu-stepper {
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 4px; border-radius: 999px; background: var(--surface-container-highest);
  }
  .stepper-btn {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: none; border-radius: 50%; background: transparent;
    color: var(--on-surface); font-family: inherit; font-size: 22px; line-height: 1;
    cursor: pointer; transition: background-color .2s ease, transform .1s ease;
  }
  .stepper-btn:hover:not(:disabled) { background: var(--state-hover); }
  .stepper-btn:active:not(:disabled) { background: var(--state-press); transform: scale(.9); }
  .stepper-btn:disabled { opacity: .32; cursor: not-allowed; }
  .stepper-value { min-width: 48px; text-align: center; font-weight: 700; font-size: 16px; color: var(--on-surface); }

  .stepper-input {
    width: 78px; padding: 6px 2px; text-align: center;
    border: none; background: transparent; color: var(--on-surface);
    font-family: inherit; font-weight: 700; font-size: 16px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .stepper-input::-webkit-outer-spin-button,
  .stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-radius: 12px; }

  .image-row { display: flex; align-items: center; gap: 12px; }
  .image-preview {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
    background-color: var(--error);
    background-image: var(--red-image, none);
    background-size: cover; background-position: center; background-repeat: no-repeat;
    box-shadow: inset 0 0 0 1px var(--outline-variant);
  }
  .image-actions { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .pill-btn {
    height: 34px; padding: 0 12px; border: 1px solid var(--outline); border-radius: 999px;
    background: transparent; color: var(--on-surface);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: background-color .2s ease, transform .1s ease, opacity .2s ease;
  }
  .pill-btn:hover { background: var(--state-hover); }
  .pill-btn:active { background: var(--state-press); transform: scale(.97); }
  .pill-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pill-btn.filled { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
  .pill-btn.filled:hover { background: var(--primary-container); }
  .image-hint { font-size: 11px; line-height: 1.4; color: var(--on-surface-variant); }

  /* ==================== 排行榜弹窗 ==================== */
  .leaderboard-dialog {
    background: var(--surface-container-high);
    width: 90%; max-width: 400px; max-height: 80vh;
    border-radius: 28px; box-shadow: var(--elev3);
    display: flex; flex-direction: column;
    transform: scale(.9); transition: transform .2s cubic-bezier(.2, 0, 0, 1);
    overflow: hidden;
  }
  .modal-backdrop.open .leaderboard-dialog { transform: scale(1); }

  .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 12px; }
  .dialog-title { margin: 0; font-size: 22px; font-weight: 400; color: var(--on-surface); }
  .close-btn {
    width: 36px; height: 36px; border: none; border-radius: 50%;
    background: transparent; color: var(--on-surface-variant);
    display: grid; place-items: center; cursor: pointer;
  }
  .close-btn:hover { background: var(--state-hover); }

  .leaderboard-list {
    flex: 1; overflow-y: auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  
  .empty-state { text-align: center; padding: 32px 0; color: var(--on-surface-variant); font-size: 14px; line-height: 1.6; word-break: break-all; }

  .rank-item {
    display: flex; align-items: flex-start; padding: 12px 14px;
    background: var(--surface-container); border-radius: 16px; gap: 12px;
  }
  .rank-item:nth-child(1) { border: 1px solid var(--gold); }
  .rank-item:nth-child(2) { border: 1px solid var(--silver); }
  .rank-item:nth-child(3) { border: 1px solid var(--bronze); }

  .rank-num {
    width: 24px; text-align: center; font-size: 16px; font-weight: 700; margin-top: 1px;
    font-variant-numeric: tabular-nums; color: var(--on-surface-variant);
  }
  .rank-item:nth-child(1) .rank-num { color: var(--gold); }
  .rank-item:nth-child(2) .rank-num { color: var(--silver); }
  .rank-item:nth-child(3) .rank-num { color: var(--bronze); }

  .rank-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rank-score { font-size: 19px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; margin-left: auto; }
  .rank-unit { font-size: 11px; color: var(--on-surface-variant); }

  .rank-meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-size: 11px; color: var(--on-surface-variant);
  }
  .rank-tag { padding: 2px 6px; border-radius: 6px; background: var(--surface-variant); color: var(--on-surface); font-weight: 500; }
  .rank-tag.hard { background: var(--error); color: var(--on-primary); }

  .rank-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .rank-name {
    flex: 1; min-width: 0;
    font-size: 13.5px; font-weight: 700; color: var(--on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-you { color: var(--primary); font-weight: 700; font-size: 11px; flex: 0 0 auto; }
  .rank-item.is-me {
    background: var(--secondary-container);
    box-shadow: inset 0 0 0 2px var(--primary);
  }

  .lb-groups {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px;
  }
  .lb-chip {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--outline); background: transparent;
    color: var(--on-surface-variant); font: inherit; font-size: 12px; line-height: 1;
    cursor: pointer; white-space: nowrap;
  }
  .lb-chip:hover { background: var(--state-hover); }
  .lb-chip.active {
    background: var(--secondary-container); color: var(--on-surface);
    border-color: transparent; font-weight: 600;
  }

  .lb-banner {
    margin: 0 16px 10px; padding: 10px 14px; border-radius: 14px;
    background: var(--secondary-container); color: var(--on-secondary-container);
    font-size: 13px; font-weight: 600; display: none;
  }
  .lb-banner.show { display: block; }
  .lb-banner.error { background: var(--surface-variant); color: var(--error); }

  /* ==================== 上榜弹窗（写名字） ==================== */
  .name-dialog {
    background: var(--surface-container-high);
    width: 90%; max-width: 360px;
    border-radius: 28px; box-shadow: var(--elev3);
    padding: 24px; display: flex; flex-direction: column; gap: 10px;
    transform: scale(.9); transition: transform .2s cubic-bezier(.2, 0, 0, 1);
  }
  .modal-backdrop.open .name-dialog { transform: scale(1); }
  .name-title { margin: 0; font-size: 20px; font-weight: 500; color: var(--on-surface); }
  .name-sub { margin: 0; font-size: 13px; color: var(--on-surface-variant); }
  .name-input {
    width: 100%; height: 52px; padding: 0 16px; border-radius: 14px;
    border: 1px solid var(--outline); background: var(--surface-container);
    color: var(--on-surface); font-family: inherit; font-size: 16px;
  }
  .name-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
  .name-input:disabled { opacity: .6; }
  .name-hint { margin: 0; min-height: 16px; font-size: 11.5px; color: var(--on-surface-variant); }
  .name-actions { display: flex; gap: 10px; margin-top: 4px; }
  .name-actions .pill-btn { flex: 1; height: 44px; font-size: 14px; }
  #saveNameBtn { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  #saveNameBtn:hover { background: var(--primary); filter: brightness(1.06); }
  #saveNameBtn:disabled { opacity: .5; filter: none; }

  /* ==================== HUD ==================== */
  .hud {
    flex: 0 0 auto; position: relative;
    display: flex; align-items: center; justify-content: space-around;
    padding: 12px 6px 14px; border-radius: 20px; background: var(--surface-container);
  }

  .hud-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .hud-stat.primary .hud-value {
    font-size: 38px; font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; color: var(--primary); letter-spacing: -1px;
  }
  .hud-stat.primary #timer { color: var(--error); }
  .hud-stat.primary #timer.urgent { animation: pulseNum .75s ease-in-out infinite; }

  .hud-stat.secondary .hud-value {
    font-size: 20px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums; color: var(--on-surface);
  }

  .hud-label {
    font-size: 11px; font-weight: 500; letter-spacing: .5px;
    color: var(--on-surface-variant); white-space: nowrap;
    display: flex; align-items: center; gap: 3px;
  }

  .hard-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--error); }
  .hud-divider { width: 1px; height: 34px; border-radius: 1px; background: var(--outline-variant); }

  @keyframes pulseNum { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  .hud-progress {
    position: absolute; left: 14px; right: 14px; bottom: 6px;
    height: 4px; border-radius: 2px; overflow: hidden; background: var(--surface-variant);
  }
  .hud-progress-bar {
    height: 100%; width: 100%; border-radius: 2px; background: var(--primary);
    transition: width .35s linear, background-color .3s ease;
  }
  .hud-progress-bar.low { background: var(--error); }

  /* ==================== 棋盘 ==================== */
  .board-area { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .board { flex: 0 0 auto; padding: 6px; border-radius: 24px; background: var(--surface-container-low); }
  #grid { display: grid; width: 100%; height: 100%; gap: 8px; touch-action: none; }

  .cell {
    position: relative; overflow: hidden; min-width: 0; min-height: 0;
    border-radius: var(--cell-radius, 14px); background: var(--surface-container-highest);
    transition: background-color .2s ease, border-radius .3s ease; will-change: transform;
  }

  .cell.red {
    cursor: pointer;
    background-color: var(--error);
    background-image: var(--red-image, none);
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  @media (hover: hover) { .cell.red:hover { background-color: var(--error-hover); } }

  .cell.hit { animation: hit .28s cubic-bezier(.2, 0, 0, 1); }
  @keyframes hit { 0% { transform: scale(1); } 35% { transform: scale(.85); } 100% { transform: scale(1); } }

  .cell.appear { animation: appear .32s cubic-bezier(.05, .75, .15, 1); }
  @keyframes appear { 0% { transform: scale(.55); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }

  .cell.wrong { background: var(--error) !important; animation: wrongShake .4s ease; }
  @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } }

  .ripple {
    position: absolute; border-radius: 50%; background: var(--ripple);
    transform: scale(0); animation: ripple .5s ease-out forwards;
    pointer-events: none; z-index: 2;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }

  /* ==================== 底部 ==================== */
  .footer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 4px; }

  .start-btn {
    position: relative; overflow: hidden; border: none; border-radius: 999px;
    height: 50px; width: 100%; max-width: 320px; padding: 0 30px;
    font-family: inherit; font-size: 16px; font-weight: 500; letter-spacing: .3px;
    color: var(--on-primary); background: var(--primary); box-shadow: var(--elev1);
    cursor: pointer; transition: background-color .3s ease, color .3s ease, box-shadow .2s ease, transform .1s ease;
  }
  .start-btn:hover { box-shadow: var(--elev2); }
  .start-btn:active { transform: scale(.975); }
  .btn-label { position: relative; z-index: 1; }

  .status {
    height: 18px; line-height: 18px; font-size: 12.5px; letter-spacing: .2px;
    text-align: center; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden;
  }
  .status.done { color: var(--primary); font-weight: 500; }

  @media (max-height: 660px) {
    .app { gap: 4px; }
    .app-title { font-size: 17px; }
    .hud-stat.primary .hud-value { font-size: 32px; }
    .hud-stat.secondary .hud-value { font-size: 18px; }
    .hud { padding: 8px 6px 12px; }
    .start-btn { height: 44px; font-size: 14px; }
    .status { height: 16px; line-height: 16px; font-size: 12px; }
    .board { padding: 4px; }
    #grid { gap: 5px; }
  }

  @media (max-width: 370px) {
    .app-title { font-size: 16px; }
    .icon-btn { width: 36px; height: 36px; }
    .settings-menu { width: 260px; padding: 12px; }
    .hud-stat.primary .hud-value { font-size: 30px; }
    .hud-stat.secondary .hud-value { font-size: 16px; }

  function t(key, params) {
    const dict = I18N[lang] || I18N.zh;
    let str = dict[key];
    if (typeof str !== 'string') str = I18N.zh[key];
    if (typeof str !== 'string') str = key;
    if (params) {
      Object.keys(params).forEach(function (k) {
        str = str.split('{' + k + '}').join(String(params[k]));

  /* =====================================================
     音效引擎
     ===================================================== */
  const Sound = (() => {
    let ctx = null, master = null, muted = false;
    try { muted = localStorage.getItem('rgj-muted') === '1'; } catch (e) { muted = false; }

    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.85;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 8;
        comp.attack.value = 0.003; comp.release.value = 0.2;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, opts = {}) {
      const c = ensure();
      if (!c) return;
      const { type = 'triangle', dur = 0.16, gain = 0.16, delay = 0, slideTo = null, attack = 0.006 } = opts;
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur * 0.75);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
    const BASE = 392;

    return {
      unlock() { ensure(); },
      click(step) {
        if (muted) return;
        const semi = PENTA[step % PENTA.length];
        const f = BASE * Math.pow(2, semi / 12);
        tone(f, { type: 'triangle', dur: 0.15, gain: 0.15, slideTo: f * 1.5 });
        tone(f * 2, { type: 'sine', dur: 0.09, gain: 0.055 });
      },
      start() {
        if (muted) return;
        [392, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.18, gain: 0.13, delay: i * 0.075 }));
      },
      end() {
        if (muted) return;
        [659.25, 523.25, 392, 293.66].forEach((f, i) => tone(f, { type: 'sine', dur: 0.3, gain: 0.15, delay: i * 0.11 }));
      },
      fail() {
        if (muted) return;
        tone(220, { type: 'sawtooth', dur: 0.25, gain: 0.15, slideTo: 110 });
        tone(110, { type: 'square', dur: 0.4, gain: 0.15, delay: 0.15 });
      },
      get muted() { return muted; },
      setMuted(v) {
        muted = v;
        try { localStorage.setItem('rgj-muted', v ? '1' : '0'); } catch (e) {}
        if (!v) ensure();

  /* ---------- 红格子自定义图片 ---------- */
  const IMAGE_MAX_MB = 8;
  const IMAGE_MAX_BYTES = IMAGE_MAX_MB * 1024 * 1024;
  const IMAGE_KEY = 'rgj-red-image';
  const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp)$/i;

  let redImageData = '';
  try {
    const savedImage = localStorage.getItem(IMAGE_KEY);
    if (savedImage && savedImage.indexOf('data:image/') === 0) redImageData = savedImage;
  } catch (e) {}

  const pickImageBtn  = document.getElementById('pickImageBtn');

  function applyRedImage() {
    if (redImageData) {
      document.documentElement.style.setProperty('--red-image', 'url("' + redImageData + '")');
    } else {
      document.documentElement.style.removeProperty('--red-image');
    }
    resetImageBtn.disabled = !redImageData;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function downscaleImage(src, maxSide) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxSide / Math.max(img.width || 1, img.height || 1));
          const w = Math.max(1, Math.round((img.width || 1) * scale));
          const h = Math.max(1, Math.round((img.height || 1) * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!ctx) { reject(new Error('no canvas')); return; }
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let out = canvas.toDataURL('image/webp', 0.9);
          if (out.indexOf('data:image/webp') !== 0) out = canvas.toDataURL('image/png');
          resolve(out);
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('image decode failed'));
      img.src = src;
    });
  }

  function saveRedImage(dataUrl) {
    redImageData = dataUrl;
    applyRedImage();
    let saved = true;
    try { localStorage.setItem(IMAGE_KEY, dataUrl); } catch (e) { saved = false; }
    if (!saved) {
      try { localStorage.removeItem(IMAGE_KEY); } catch (e) {}
      setStatus('status.imageSaveFailed', { timeout: 3200 });
    } else {
      setStatus('status.imageLoaded', { timeout: 2400 });
    }
  }

  function handleImageFile(file) {
    if (!file) return;
    const typeOk = IMAGE_TYPES.indexOf(file.type) >= 0 || IMAGE_EXT.test(file.name || '');
    if (!typeOk) { setStatus('status.imageUnsupported', { timeout: 2600 }); return; }
    if (file.size > IMAGE_MAX_BYTES) {
      setStatus('status.imageTooBig', { params: { size: IMAGE_MAX_MB }, timeout: 3000 });
      return;
    }
    const isGif = file.type === 'image/gif' || /\.gif$/i.test(file.name || '');
    const reader = new FileReader();
    reader.onerror = () => setStatus('status.imageUnsupported', { timeout: 2600 });
    reader.onload = () => {
      const raw = String(reader.result || '');
      if (!raw || raw.indexOf('data:image/') !== 0) {
        setStatus('status.imageUnsupported', { timeout: 2600 });
        return;
      }
      // GIF 需要保留动画，不能走 canvas 缩放；其余格式缩到 320px 以节省存储空间
      if (isGif) { saveRedImage(raw); return; }
      downscaleImage(raw, 320).then(saveRedImage).catch(function () { saveRedImage(raw); });
    };
    reader.readAsDataURL(file);
  }

  async function fetchGroupOptions() {
    const fallback = [{ key: LB_DEFAULT_GROUP, grid: '4x4', reds: 3 }];
    if (!supabaseClient) { groupOptions = fallback; paintGroupChips(); return; }
    try {
      const { data, error } = await supabaseClient.from('leaderboard').select('grid,reds').limit(1000);
      if (error) throw error;
      const seen = {};
      const list = [];
      (data || []).forEach(function (it) {
        if (it.grid == null || it.reds == null) return;
        const k = groupKey(it.grid, it.reds);
        if (seen[k]) return;
        seen[k] = true;
        list.push({ key: k, grid: String(it.grid), reds: Number(it.reds) });
      });
      if (!seen[LB_DEFAULT_GROUP]) list.unshift({ key: LB_DEFAULT_GROUP, grid: '4x4', reds: 3 });
      list.sort(function (a, b) {
        const aStd = a.key === LB_DEFAULT_GROUP, bStd = b.key === LB_DEFAULT_GROUP;
        if (aStd !== bStd) return aStd ? -1 : 1;
        const ag = parseInt(a.grid, 10) || 0, bg = parseInt(b.grid, 10) || 0;
        if (ag !== bg) return ag - bg;
        return a.reds - b.reds;
      });
      groupOptions = list;

  async function insertScore(finalScore, finalCps, name, secs) {
    const row = {
      score: finalScore,
      cps: parseFloat(finalCps),
      grid: gridSize + 'x' + gridSize,
      reds: numReds,
      hard: hardMode
    };
    if (name && hasNameColumn !== false) row.name = name;
    if (secs && hasSecsColumn !== false) row.secs = secs;

    let res = await supabaseClient.from('leaderboard').insert([row]).select();
    // 表里缺少 name / secs 列时，去掉那一列重试，别让分数丢失
    for (let attempt = 0; attempt < 2 && res.error && res.error.code === 'PGRST204'; attempt++) {
      const msg = String(res.error.message || '');
      const m = msg.match(/the '([a-zA-Z_]+)' column/);
      const missing = m ? m[1] : (row.secs !== undefined ? 'secs' : 'name');
      if (missing === 'name' && row.name !== undefined) {
        hasNameColumn = false;
        delete row.name;
      } else if (missing === 'secs' && row.secs !== undefined) {
        hasSecsColumn = false;
        delete row.secs;
      } else {
        break;
      }
      res = await supabaseClient.from('leaderboard').insert([row]).select();
    }
    if (res.error) throw res.error;
    return (res.data && res.data[0]) ? res.data[0] : null;
  }

  async function computeRank(finalScore, finalCps, createdAt, groupGrid, groupReds) {
    if (!supabaseClient) return { rank: 0, total: 0 };
    try {
      const cps = Number(finalCps) || 0;
      const base = function () {
        let q = supabaseClient.from('leaderboard').select('id', { count: 'exact', head: true });
        if (groupGrid != null && groupReds != null) {
          q = q.eq('grid', groupGrid).eq('reds', groupReds);
        }
        return q;
      };
      const higherScore = await base().gt('score', finalScore);
      const sameScoreHigherCps = await base().eq('score', finalScore).gt('cps', cps);
      // 分数、CPS 都相同时按 created_at 先后排队，名次才唯一
      let sameScoreSameCpsEarlier = { count: 0 };
      if (createdAt) {
        sameScoreSameCpsEarlier = await base().eq('score', finalScore).eq('cps', cps).lt('created_at', createdAt);
      }
      const all = await base();
      return {
        rank: (higherScore.count || 0) + (sameScoreHigherCps.count || 0) +
              (sameScoreSameCpsEarlier.count || 0) + 1,
        total: all.count || 0
      };
    } catch (e) {
      return { rank: 0, total: 0 };
    }
  }

  async function recordScore(finalScore, finalCps, playedTime) {
    if (finalScore <= 0 || !supabaseClient) return;

    const playedGrid = gridSize + 'x' + gridSize;
    const playedReds = numReds;
    myEntry = { id: null, name: '', score: finalScore, rank: 0, total: 0, failed: false, grid: playedGrid, reds: playedReds };
    const entered = await promptForName(finalScore);
    const name = (entered || '').trim().slice(0, NAME_MAX);

    try {
      const row = await insertScore(finalScore, finalCps, name, Math.max(1, Math.round(playedTime || 0)));
      const pos = await computeRank(finalScore, finalCps, row ? row.created_at : null, playedGrid, playedReds);
      myEntry.id = row ? row.id : null;
      myEntry.name = name;
      if (myEntry.id && hasSecsColumn === false) {
        localSecs[myEntry.id] = Math.max(1, Math.round(playedTime || 0));
        try {
          const ids = Object.keys(localSecs);
          if (ids.length > 50) { ids.slice(0, ids.length - 50).forEach(function (k) { delete localSecs[k]; }); }
          localStorage.setItem('rgj-secs', JSON.stringify(localSecs));
        } catch (e) {}
      }
      if (name && myEntry.id && hasNameColumn === false) {
        localNames[myEntry.id] = name;
        try {
          const ids = Object.keys(localNames);
          if (ids.length > 50) { ids.slice(0, ids.length - 50).forEach(function (k) { delete localNames[k]; }); }
          localStorage.setItem('rgj-names', JSON.stringify(localNames));
        } catch (e) {}
      }
      myEntry.rank = pos.rank;
      myEntry.total = pos.total;
      // 结束后自动切到本局对应的榜单，方便直接看到自己的名次
      activeGroup = groupKey(playedGrid, playedReds);
      try { localStorage.setItem('rgj-lb-group', activeGroup); } catch (e) {}
      paintGroupChips();
      fetchGlobalHighScore();
      fetchGroupOptions();
    } catch (e) {
      console.error('分数上传失败:', e.message);
      myEntry.failed = true;
    }

    nameModal.classList.remove('open');
    openLeaderboard();
  }

  function openLeaderboard() {
    Sound.unlock();
    paintGroupChips();
    if (!groupOptions.length) fetchGroupOptions();
    updateRankBanner();
    renderLeaderboard();
    leaderboardModal.classList.add('open');
  }

  if (lbGroupsEl) {
    lbGroupsEl.addEventListener('click', function (e) {
      const chip = e.target.closest ? e.target.closest('.lb-chip') : null;
      if (!chip) return;
      const next = chip.getAttribute('data-group');
      if (!next || next === activeGroup) return;
      activeGroup = next;
      try { localStorage.setItem('rgj-lb-group', activeGroup); } catch (e) {}
      paintGroupChips();
      updateRankBanner();
      renderLeaderboard();
      Sound.click(0);
    });
  }

  leaderboardBtn.addEventListener('click', openLeaderboard);
  closeLeaderboardBtn.addEventListener('click', () => leaderboardModal.classList.remove('open'));
  leaderboardModal.addEventListener('click', (e) => { if (e.target === leaderboardModal) leaderboardModal.classList.remove('open'); });

  /* =====================================================
     游戏主体逻辑
     ===================================================== */
  let gridSize = 4;
  let numReds = 3;

  const cells = [];
  const reds = new Set();
  let clickTimes = [];
  let score = 0;
  let timeLeft = gameTime;
  let running = false;
  let timerId = null;

  const gridEl      = document.getElementById('grid');
  const boardEl     = document.getElementById('board');
  const boardArea   = document.getElementById('boardArea');
  const scoreEl     = document.getElementById('score');
  const cpsEl       = document.getElementById('cps');
  const timerEl     = document.getElementById('timer');
  const progressBar = document.getElementById('progressBar');
  const startBtn    = document.getElementById('startBtn');
  const btnLabel    = startBtn.querySelector('.btn-label');
  const statusEl    = document.getElementById('status');
  const redValueEl  = document.getElementById('redValue');
  const redMinus    = document.getElementById('redMinus');
  const redPlus     = document.getElementById('redPlus');
  const sizeSegmented = document.getElementById('sizeSegmented');

  /* ---------- 底部状态提示（语言切换后自动重渲染） ---------- */
  let statusKey = '';
  let statusParams = null;
  let statusDone = false;
  let statusColor = '';
  let statusToken = 0;

  function setStartLabel(key) {
    startLabelKey = key;
    btnLabel.textContent = t(key);
  }

  function renderStatus() {
    if (!statusEl) return;
    if (!statusKey) {
      statusEl.textContent = '';
      statusEl.classList.remove('done');
      statusEl.style.color = '';
      return;
    }
    statusEl.textContent = t(statusKey, statusParams);
    statusEl.classList.toggle('done', statusDone);
    statusEl.style.color = statusColor;
  }

  function setStatus(key, opts) {
    opts = opts || {};
    statusKey = key || '';
    statusParams = opts.params || null;
    statusDone = !!opts.done;
    statusColor = opts.color || '';
    const token = ++statusToken;
    renderStatus();
    if (opts.timeout > 0) {
      setTimeout(() => {
        if (statusToken !== token) return;
        statusKey = ''; statusParams = null; statusDone = false; statusColor = '';
        renderStatus();
      }, opts.timeout);
    }
  }

  function fitBoard() {
    const r = boardArea.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    const size = Math.floor(Math.min(r.width, r.height));
    if (size <= 0) return;
    boardEl.style.width = size + 'px';
    boardEl.style.height = size + 'px';
  }

  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(boardArea);
  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', () => setTimeout(fitBoard, 160));

  function totalCells() { return gridSize * gridSize; }
  function maxReds()    { return totalCells() - 1; }

  function updateRedStepper() {
    redValueEl.textContent = numReds;
    redMinus.disabled = numReds <= 1;
    redPlus.disabled  = numReds >= maxReds();
  }

  function updateSizeButtons() {
    sizeSegmented.querySelectorAll('button').forEach(btn => {
      const isSel = +btn.dataset.size === gridSize;
      btn.classList.toggle('selected', isSel);
      btn.setAttribute('aria-checked', isSel ? 'true' : 'false');
    });
  }

  function rebuildGrid() {
    gridEl.innerHTML = '';
    cells.length = 0;
    reds.clear();

    const n = gridSize;
    gridEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    gridEl.style.gridTemplateRows    = `repeat(${n}, 1fr)`;

    const gap = n <= 2 ? 12 : n <= 4 ? 8 : n <= 6 ? 6 : 4;
    gridEl.style.gap = gap + 'px';

    const radius = n <= 2 ? 22 : n <= 4 ? 16 : n <= 6 ? 11 : 8;
    root.style.setProperty('--cell-radius', radius + 'px');

    const total = n * n;
    for (let i = 0; i < total; i++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.addEventListener('pointerdown', (e) => onPointerDown(e, i));
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      gridEl.appendChild(el);
      cells.push(el);
    }
    fitBoard();
  }

  function randomEmpty(exclude) {
    const total = cells.length;
    const empties = [];
    for (let i = 0; i < total; i++) {
      if (!reds.has(i) && i !== exclude) empties.push(i);
    }
    if (empties.length === 0) {
      for (let i = 0; i < total; i++) if (!reds.has(i)) return i;
      return -1;
    }
    return empties[(Math.random() * empties.length) | 0];
  }

  function paintRed(index) {
    if (index < 0) return;
    reds.add(index);
    const el = cells[index];
    el.classList.remove('appear');
    void el.offsetWidth;
    el.classList.add('red', 'appear');
    clearTimeout(el._appearTimer);
    el._appearTimer = setTimeout(() => el.classList.remove('appear'), 360);
  }

  function clearAllCells() {
    reds.clear();
    cells.forEach(el => {
      clearTimeout(el._appearTimer);
      el.classList.remove('red', 'appear', 'hit', 'wrong');
      const r = el.querySelector('.ripple');
      if (r) r.remove();
    });
  }

  function spawnReds() {
    let guard = 0;
    while (reds.size < numReds && guard++ < 900) {
      const idx = randomEmpty(-1);
      if (idx < 0) break;
      paintRed(idx);
    }
  }

  function spawnRipple(cell, e) {
    const rect = cell.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2.3;
    const cx = (typeof e.clientX === 'number' ? e.clientX : rect.left + rect.width / 2) - rect.left;
    const cy = (typeof e.clientY === 'number' ? e.clientY : rect.top + rect.height / 2) - rect.top;

    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width  = size + 'px';
    span.style.height = size + 'px';
    span.style.left = (cx - size / 2) + 'px';
    span.style.top  = (cy - size / 2) + 'px';
    cell.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
  }

  function onPointerDown(e, index) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!running) return;

    if (hardMode && !reds.has(index)) {
      e.preventDefault();
      Sound.unlock();
      const el = cells[index];
      el.classList.add('wrong');
      setTimeout(() => el.classList.remove('wrong'), 400);
      failGame();
      return;
    }

    if (!reds.has(index)) return;

    e.preventDefault();
    Sound.unlock();
    clickTimes.push(performance.now());
    
    const el = cells[index];
    spawnRipple(el, e);

    reds.delete(index);
    clearTimeout(el._appearTimer);
    el.classList.remove('red', 'appear');

    el.classList.remove('hit');
    void el.offsetWidth;
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 300);

    const next = randomEmpty(index);
    if (next >= 0) paintRed(next);

    score++;
    Sound.click(score - 1);
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    timerEl.textContent = timeLeft;
    const pct = Math.max(0, Math.min(1, timeLeft / gameTime)) * 100;
    progressBar.style.width = pct + '%';
    const low = gameTime >= 15 ? timeLeft <= 10 : timeLeft <= Math.max(2, Math.ceil(gameTime / 3));
    progressBar.classList.toggle('low', low);
    timerEl.classList.toggle('urgent', low && running);
  }

  function applyConfig() {
    const wasRunning = running;
    if (running) { running = false; clearInterval(timerId); }

    score = 0;
    timeLeft = gameTime;
    setStartLabel('btn.start');
    cpsEl.textContent = '0.0';
    clickTimes = [];

    if (wasRunning) {
      setStatus('status.configChanged');
    } else {
      setStatus('');
    }

    rebuildGrid();
    spawnReds();
    updateHUD();
    fitBoard();
  }

  function startGame() {
    clearInterval(timerId);
    clearAllCells();
    Sound.unlock(); Sound.start();

    score = 0;
    timeLeft = gameTime;
    running = true;
    clickTimes = [];

    setStatus('');
    setStartLabel('btn.restart');

    spawnReds();
    updateHUD();
    timerId = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft--;
    if (timeLeft < 0) timeLeft = 0;
    updateHUD();
    if (timeLeft <= 0) endGame();
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    clearAllCells();

    progressBar.style.width = '0%';
    progressBar.classList.remove('low');
    timerEl.classList.remove('urgent');

    setStatus('status.timeUp', { params: { score: score }, done: true });
    setStartLabel('btn.again');

    const playedTime = Math.max(1, gameTime);
    const avgCps = (score / playedTime).toFixed(1);
    recordScore(score, avgCps, playedTime);

    cpsEl.textContent = '0.0';
    clickTimes = [];
    Sound.end();
  }

  function failGame() {
    if (!running) return;
    running = false;
    clearInterval(timerId);

    reds.clear();
    cells.forEach((el) => {
      clearTimeout(el._appearTimer);
      el.classList.remove('red', 'appear');
      const r = el.querySelector('.ripple');
      if (r) r.remove();
    });

    progressBar.style.width = '0%';
    progressBar.classList.remove('low');
    timerEl.classList.remove('urgent');

    setStatus('status.failed', { params: { score: score }, done: true, color: 'var(--error)' });
    setStartLabel('btn.again');

    const playedTime = Math.max(1, gameTime - timeLeft);
    const avgCps = (score / playedTime).toFixed(1);
    recordScore(score, avgCps, playedTime);

    cpsEl.textContent = '0.0';
    clickTimes = [];
    Sound.fail();
  }

  setInterval(() => {
    if (!running) return;
    const now = performance.now();
    clickTimes = clickTimes.filter(t => now - t < 2000);
    cpsEl.textContent = (clickTimes.length / 2).toFixed(1);
  }, 200);

  sizeSegmented.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      Sound.unlock();
      const size = +btn.dataset.size;
      if (size === gridSize) return;
      gridSize = size;
      if (numReds > maxReds()) numReds = maxReds();
      if (numReds < 1) numReds = 1;
      updateSizeButtons();
      updateRedStepper();
      applyConfig();
    });
  });

  redMinus.addEventListener('click', () => { Sound.unlock(); if (numReds > 1) { numReds--; updateRedStepper(); applyConfig(); } });
  redPlus.addEventListener('click', () => { Sound.unlock(); if (numReds < maxReds()) { numReds++; updateRedStepper(); applyConfig(); } });
  startBtn.addEventListener('click', startGame);

  updateSizeButtons();
  updateRedStepper();
  updateTimeControl();
  fetchGroupOptions();
  applyLanguage(lang, false);
  applyConfig();
  fetchGlobalHighScore();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitBoard); }
  setTimeout(fitBoard, 60);
  setTimeout(fitBoard, 320);
</script>
</body>
